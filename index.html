<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Port</title>
<meta name="description" content="Color Port: renkli konteynerleri doğru gemiye yükle. A colourful container-sorting puzzle game.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f4f8fd; --ink: #14233a; --muted: #5a6b84; --accent: #1f57d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1726; --ink: #eaf1fb; --muted: #9db0cb; --accent: #7fb0ff; }
  }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { text-align: center; padding: 32px 16px; max-width: 520px; }
  img { width: 128px; height: 128px; border-radius: 28px; }
  h1 { font-size: 34px; margin: 18px 0 6px; }
  p { margin: 0 0 10px; color: var(--muted); }
  a { color: var(--accent); }
  .links { margin-top: 22px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Color Port">
  <h1>Color Port</h1>
  <p lang="tr">Renkli konteynerleri doğru gemiye yükle, limanı boşalt.</p>
  <p lang="en">Load the colourful containers onto the right ship and clear the harbour.</p>
  <p class="links"><a href="privacy.html">Gizlilik Politikası · Privacy Policy</a></p>
</main>
</body>
</html>
